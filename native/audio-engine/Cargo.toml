[package]
name = "audio-engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { workspace = true, features = ["napi9", "serde-json", "tokio_rt"] }
napi-derive = { workspace = true }
ffmpeg_audio = { version = "0.3.1", default-features = false, features = [
  "http",
  "tracing",
] }
libc = "0.2"
parking_lot = "0.12"
crossbeam-queue = "0.3.14"
anyhow = { workspace = true }
serde_json = "1"
thiserror = "2"
signalsmith-stretch = "0.1.3"
lofty = "0.24"
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
  "bmp",
  "webp",
] }
rustfft = "6"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
time = { workspace = true }
walkdir = "2"
tokio = { workspace = true, features = ["rt"] }
cpal = { version = "0.18.2", default-features = false, features = [
  "pipewire",
  "pulseaudio",
  "realtime-dbus",
] }

pipewire = { version = "0.10.0", features = ["v0_3_53"] }


[build-dependencies]
napi-build = { workspace = true }

[dev-dependencies]
httpmock = "0.8.3"

[lints]
workspace = true
