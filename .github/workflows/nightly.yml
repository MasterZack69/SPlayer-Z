name: Nightly Build

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-release
  cancel-in-progress: false

env:
  NODE_VERSION: 24.x

jobs:
  check-commits:
    name: Check for new commits
    runs-on: ubuntu-latest
    outputs:
      has_new_commits: ${{ steps.check.outputs.has_new_commits }}
      build_sha: ${{ steps.check.outputs.build_sha }}
      prev_sha: ${{ steps.check.outputs.prev_sha }}
    steps:
      - name: Check out dev branch
        uses: actions/checkout@v5
        with:
          ref: dev

      - name: Compare commit with latest nightly release
        id: check
        shell: bash
        run: |
          echo "build_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          NIGHTLY_TAG="nightly"
          REMOTE_TAG_SHA=$(git ls-remote origin "refs/tags/$NIGHTLY_TAG" | awk '{print $1}')
          CURRENT_DEV_SHA=$(git rev-parse HEAD)

          echo "Current dev commit: $CURRENT_DEV_SHA"
          echo "Previous nightly commit: $REMOTE_TAG_SHA"
          echo "prev_sha=$REMOTE_TAG_SHA" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run; continuing"
            echo "has_new_commits=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$REMOTE_TAG_SHA" ] && [ "$REMOTE_TAG_SHA" = "$CURRENT_DEV_SHA" ]; then
            echo "No changes since the previous nightly; skipping"
            echo "has_new_commits=false" >> "$GITHUB_OUTPUT"
          else
            echo "New commits found; building Linux packages"
            echo "has_new_commits=true" >> "$GITHUB_OUTPUT"
          fi
  build:
    name: Build on ${{ matrix.name }}
    needs: check-commits
    if: needs.check-commits.outputs.has_new_commits == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-latest
            target: linux-x64
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            target: linux-arm64
    steps:
      - name: Check out git repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.check-commits.outputs.build_sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libdbus-1-dev libpipewire-0.3-dev libpulse-dev pkg-config clang \
            rpm libarchive-tools
      - name: Clean workspace
        shell: bash
        run: rm -rf dist out
      - name: Remove registry mirror configuration
        shell: bash
        run: rm -f .npmrc
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Nightly Version
        shell: bash
        run: node scripts/gen-nightly-version.cjs
      - name: Build ${{ matrix.name }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_CHANNEL: nightly
        run: |
          case "${{ matrix.target }}" in
            linux-x64)
              pnpm build:linux --x64 --publish never
              ;;
            linux-arm64)
              pnpm build:linux --arm64 --publish never
              ;;
            *)
              echo "Unsupported target: ${{ matrix.target }}"
              exit 1
              ;;
          esac
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: SPlayer-Z-${{ matrix.target }}
          path: dist/*.*
  release:
    name: Publish Nightly Release
    needs: [check-commits, build]
    if: needs.check-commits.outputs.has_new_commits == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev branch
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.check-commits.outputs.build_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Read Nightly Version
        shell: bash
        run: |
          node scripts/gen-nightly-version.cjs
          VERSION="$(node -p "require('./package.json').version")"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Generate Nightly release notes
        env:
          PREV_COMMIT_SHA: ${{ needs.check-commits.outputs.prev_sha }}
        run: node scripts/gen-nightly-notes.cjs notes.md
      - name: Prepare release assets
        shell: bash
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/jsyaml" js-yaml@4.1.0
          NODE_PATH="$RUNNER_TEMP/jsyaml/node_modules" \
            node --test .github/scripts/prepare-release-assets.test.cjs
          NODE_PATH="$RUNNER_TEMP/jsyaml/node_modules" \
            node .github/scripts/prepare-release-assets.cjs artifacts release-assets "$APP_VERSION" notes.md
          echo "待发布资源："
          ls -1 release-assets
      - name: Publish or Update Nightly Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY_TAG: nightly
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$NIGHTLY_TAG"
          git push -f origin "$NIGHTLY_TAG"

          if gh release view "$NIGHTLY_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "正在重置已有 Nightly Release..."
            gh release delete "$NIGHTLY_TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi

          gh release create "$NIGHTLY_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "v$APP_VERSION" \
            --notes-file notes.md \
            --prerelease \
            release-assets/*
