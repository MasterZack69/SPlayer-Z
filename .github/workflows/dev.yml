name: Build Dev

on:
  push:
    branches:
      - dev
    paths:
      - "src/**"
      - "electron/**"
      - "native/**"
      - "shared/**"
      - "public/**"
      - "resources/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "electron-builder.config.ts"
      - "electron.vite.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/dev.yml"
  workflow_dispatch:

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.x

jobs:
  build:
    name: Build on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-latest
            target: linux-x64
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            target: linux-arm64
    steps:
      - name: Check out git repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libdbus-1-dev libpipewire-0.3-dev libpulse-dev pkg-config clang \
            rpm libarchive-tools
      - name: Clean workspace
        shell: bash
        run: rm -rf dist out
      - name: Remove registry mirror configuration
        shell: bash
        run: rm -f .npmrc
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build ${{ matrix.name }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "${{ matrix.target }}" in
            linux-x64)
              pnpm build:linux --x64 --publish never
              ;;
            linux-arm64)
              pnpm build:linux --arm64 --publish never
              ;;
            *)
              echo "Unsupported target: ${{ matrix.target }}"
              exit 1
              ;;
          esac
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: SPlayer-Next-${{ matrix.target }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.pacman
          if-no-files-found: ignore
