name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的标签（例如 v1.1.0-beta.1 或 v1.1.0-alpha.1）"
        required: true
        type: string

permissions:
  contents: write

env:
  NODE_VERSION: 22.x
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-latest
            target: linux-x64
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            target: linux-arm64
    steps:
      - name: Check out git repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Verify release metadata
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v$VERSION" != "$RELEASE_TAG" ]; then
            echo "Tag $RELEASE_TAG does not match package.json version v$VERSION"
            exit 1
          fi
          case "$VERSION" in
            *-alpha|*-alpha.*)
              echo "UPDATE_CHANNEL=alpha" >> "$GITHUB_ENV"
              ;;
            *-beta|*-beta.*)
              echo "UPDATE_CHANNEL=beta" >> "$GITHUB_ENV"
              ;;
            *-*)
              echo "Unsupported prerelease version: $VERSION"
              exit 1
              ;;
            *)
              echo "UPDATE_CHANNEL=latest" >> "$GITHUB_ENV"
              ;;
          esac
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libdbus-1-dev libpipewire-0.3-dev libpulse-dev pkg-config clang \
            rpm libarchive-tools
      - name: Clean workspace
        shell: bash
        run: rm -rf dist out
      - name: Remove registry mirror configuration
        shell: bash
        run: rm -f .npmrc
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build ${{ matrix.name }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "${{ matrix.target }}" in
            linux-x64)
              pnpm build:linux --x64 --publish never
              ;;
            linux-arm64)
              pnpm build:linux --arm64 --publish never
              ;;
            *)
              echo "Unsupported target: ${{ matrix.target }}"
              exit 1
              ;;
          esac

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: SPlayer-Next-${{ matrix.name }}
          path: dist/*.*
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify release metadata
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v$VERSION" != "$RELEASE_TAG" ]; then
            echo "Tag $RELEASE_TAG does not match package.json version v$VERSION"
            exit 1
          fi
          case "$VERSION" in
            *-alpha|*-alpha.*)
              echo "UPDATE_CHANNEL=alpha" >> "$GITHUB_ENV"
              ;;
            *-beta|*-beta.*)
              echo "UPDATE_CHANNEL=beta" >> "$GITHUB_ENV"
              ;;
            *-*)
              echo "Unsupported prerelease version: $VERSION"
              exit 1
              ;;
            *)
              echo "UPDATE_CHANNEL=latest" >> "$GITHUB_ENV"
              ;;
          esac
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Prepare release assets
        shell: bash
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/jsyaml" js-yaml@4.1.0
          NODE_PATH="$RUNNER_TEMP/jsyaml/node_modules" \
            node --test .github/scripts/prepare-release-assets.test.cjs
          NODE_PATH="$RUNNER_TEMP/jsyaml/node_modules" \
            node .github/scripts/prepare-release-assets.cjs artifacts release-assets "$APP_VERSION"
          echo "待发布资源："
          ls -1 release-assets
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          if [ "$UPDATE_CHANNEL" != "latest" ]; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --verify-tag \
              --prerelease \
              release-assets/*
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --verify-tag \
              --draft \
              release-assets/*
          fi
